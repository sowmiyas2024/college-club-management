
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Requests | CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f3ff;
            font-family: Arial, sans-serif;
        }
        .page {
            max-width: 1150px;
            margin: 50px auto;
            padding: 24px;
        }
        .panel {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 5px 24px rgba(60, 40, 100, .08);
        }
        h2 { color: #5b21b6; }
        .btn-purple {
            background: #6d28d9;
            color: white;
        }
        .btn-purple:hover {
            background: #5b21b6;
            color: white;
        }
    </style>
</head>
<body>
    <main class="page">
        <h2>Club Membership Requests</h2>
        <p class="text-secondary">View and manage student requests to join clubs.</p>

        <div id="message" class="mb-3" role="status" aria-live="polite"></div>

        <div class="panel">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Email</th>
                            <th>Club</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="membershipTable">
                        <tr>
                            <td colspan="5" class="text-center">Loading requests...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </main>

    <script>
        const table = document.getElementById("membershipTable");
        const message = document.getElementById("message");

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                ...options,
                headers: {
                    ...(options.headers || {}),
                    ...(options.body ? { "Content-Type": "application/json" } : {})
                }
            });

            const contentType = response.headers.get("content-type") || "";

            if (!contentType.includes("application/json")) {
                if (response.status === 401 || response.redirected) {
                    window.location.href = "/login.html";
                    throw new Error("Your session may have expired. Please log in again.");
                }

                throw new Error(
                    "The server returned HTML instead of JSON. Check the API route and restart the server."
                );
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Request failed.");
            }

            return data;
        }

        function showMessage(text, type = "danger") {
            message.className = "alert alert-" + type;
            message.textContent = text;
        }

        function addCell(row, text) {
            const cell = document.createElement("td");
            cell.textContent = text || "—";
            row.appendChild(cell);
            return cell;
        }

        async function updateStatus(id, status) {
            try {
                await apiRequest(
                    "/api/memberships/" + encodeURIComponent(id) + "/status",
                    {
                        method: "PATCH",
                        body: JSON.stringify({ status })
                    }
                );

                showMessage("Request " + status + " successfully.", "success");
                await loadMemberships();
            } catch (error) {
                showMessage(error.message);
            }
        }

        async function loadMemberships() {
            table.replaceChildren();

            const loadingRow = document.createElement("tr");
            const loadingCell = document.createElement("td");
            loadingCell.colSpan = 5;
            loadingCell.className = "text-center";
            loadingCell.textContent = "Loading requests...";
            loadingRow.appendChild(loadingCell);
            table.appendChild(loadingRow);

            try {
                const memberships = await apiRequest("/api/memberships/");

                table.replaceChildren();

                if (!Array.isArray(memberships) || memberships.length === 0) {
                    const row = document.createElement("tr");
                    const cell = document.createElement("td");
                    cell.colSpan = 5;
                    cell.className = "text-center text-secondary";
                    cell.textContent = "No membership requests found.";
                    row.appendChild(cell);
                    table.appendChild(row);
                    return;
                }

                memberships.forEach(item => {
                    const row = document.createElement("tr");

                    addCell(row, item.student?.name);
                    addCell(row, item.student?.email);
                    addCell(row, item.club?.name);

                    const statusCell = addCell(row, item.status);
                    statusCell.classList.add("text-capitalize");

                    const actionCell = document.createElement("td");

                    if (item.status === "pending") {
                        const approve = document.createElement("button");
                        approve.className = "btn btn-success btn-sm me-2 mb-1";
                        approve.textContent = "Approve";
                        approve.addEventListener("click", () => {
                            updateStatus(item._id, "approved");
                        });

                        const reject = document.createElement("button");
                        reject.className = "btn btn-danger btn-sm mb-1";
                        reject.textContent = "Reject";
                        reject.addEventListener("click", () => {
                            updateStatus(item._id, "rejected");
                        });

                        actionCell.append(approve, reject);
                    } else {
                        actionCell.textContent = "Processed";
                    }

                    row.appendChild(actionCell);
                    table.appendChild(row);
                });
            } catch (error) {
                table.replaceChildren();
                showMessage(error.message);

                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 5;
                cell.className = "text-center text-danger";
                cell.textContent = "Could not load membership requests.";
                row.appendChild(cell);
                table.appendChild(row);
            }
        }

        loadMemberships();
    </script>
</body>
</html>
